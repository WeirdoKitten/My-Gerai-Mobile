# Wajib untuk Expo + pnpm: tanpa hoisted bisa ada dua salinan react-native, dan path C++ di node_modules/.pnpm terlalu panjang untuk build native di Windows.
# pnpm 11 tidak membaca node-linker dari .npmrc lagi.
nodeLinker: hoisted

# Paket ini memakai binary prebuilt dari optional dependency; build script tidak perlu dijalankan.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo@57.0.27
  - '@expo/ui@57.0.22'
  - expo-linking@57.0.12
  - expo-router@57.0.25
